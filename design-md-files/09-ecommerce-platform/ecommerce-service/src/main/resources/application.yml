spring:
  application:
    name: ecommerce-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Batch-load lazy associations (e.g. Order.items on list pages) to avoid N+1 queries
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
    expiry-ms: 3600000           # access token: 1 hour
    refresh-expiry-ms: 1209600000 # refresh token: 14 days
  cart:
    ttl-hours: 168   # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-limit: 10          # requests per window for /v1/auth/**
    checkout-limit: 20      # requests per window for checkout
    window-seconds: 60
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

logging:
  level:
    com.ecommerce: INFO
    org.springframework.security: WARN

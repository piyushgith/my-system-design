spring.application.name=file-storage-service

# ---- Storage backend (Strategy pattern) -------------------------------------
# Active backend: local | minio
app.storage.backend=local
app.storage.presign-ttl=15m

# Local filesystem backend
app.storage.local.base-path=./data/storage

# MinIO / S3 backend (used only when app.storage.backend=minio)
app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=minioadmin
app.storage.minio.secret-key=minioadmin
app.storage.minio.bucket=files

# ---- Multipart request limits -----------------------------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---- Datasource (H2 in-memory for dev) --------------------------------------
spring.datasource.url=jdbc:h2:mem:filestore;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- CORS (React SPA) -------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

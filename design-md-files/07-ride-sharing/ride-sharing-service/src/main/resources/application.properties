spring.application.name=ride-sharing-service

# ---- Datasource (H2 in-memory, PostgreSQL-compatible for Flyway) ------------
spring.datasource.url=jdbc:h2:mem:rideshare;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA (schema owned by Flyway) -------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---- H2 console (dev) -------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- CORS -------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Routing (V1: OSRM Bangalore with mock fallback) ------------------------
# osrm-fallback = try OSRM, fall back to haversine mock if unavailable
app.routing.backend=osrm-fallback
app.routing.mock.avg-speed-kmh=30
app.routing.osrm.base-url=http://localhost:5000

# ---- Location store (V1: mock Redis GEO) ------------------------------------
app.location.backend=mock-redis

# ---- Matching (V1: auto-offer with timeout/retry) -----------------------------
app.matching.backend=nearest
app.matching.search-radius-km=5
app.matching.radius-expansion-km=5
app.matching.max-rounds=3
app.matching.offer-timeout-seconds=15
app.matching.total-timeout-seconds=180

# ---- Pricing ----------------------------------------------------------------
app.pricing.base-fare=40
app.pricing.per-km-rate=10
app.pricing.per-min-rate=1
app.pricing.platform-fee=10
app.pricing.minimum-fare=50
app.pricing.quote-ttl-minutes=5
app.pricing.default-surge-multiplier=1.0

# ---- Trip -------------------------------------------------------------------
app.trip.cancellation-fee-dispatched=30
app.trip.cancellation-fee-arrived=50

# ---- Payment (V1: mock Razorpay) ----------------------------------------------
app.payment.backend=mock-razorpay

# ---- Notifications (V1: mock FCM) ---------------------------------------------
app.notification.backend=mock-fcm

# ---- Events (V1: mock Kafka) --------------------------------------------------
app.events.backend=mock-kafka

# ---- Dev auth (unchanged) -----------------------------------------------------
app.auth.mock-otp=123456

# ---- OpenAPI / Swagger UI -----------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
